<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-web-browser · 抖音封面 1080x1440</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1440px;overflow:hidden;background:#05060b}
  body{font-family:'OPPO Sans 4.0','Hiragino Sans GB','Noto Sans SC',sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:1080px;height:1440px;overflow:hidden}
  .bg{position:absolute;inset:0;background:linear-gradient(160deg,#08070f 0%,#100b22 46%,#07060d 100%)}
  .b1{position:absolute;width:1100px;height:1100px;left:-280px;top:-420px;border-radius:50%;background:radial-gradient(circle,rgba(112,80,255,.5),rgba(112,80,255,.14) 45%,transparent 70%)}
  .b2{position:absolute;width:900px;height:900px;right:-260px;top:380px;border-radius:50%;background:radial-gradient(circle,rgba(48,118,255,.34),transparent 68%)}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:66px 66px;mask-image:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.9),transparent 72%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.9),transparent 72%);opacity:.5}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,transparent 40%,rgba(0,0,0,.6) 100%)}
  .wrap{position:absolute;inset:0}
  .brand{position:absolute;left:72px;top:68px;display:flex;align-items:center;gap:18px}
  .brand img{width:56px;height:56px;border-radius:13px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .brand .n{font-size:27px;font-weight:700;color:#fff;letter-spacing:-.01em}
  .brand .v{font-size:17px;color:rgba(255,255,255,.45);letter-spacing:.12em}
  .kicker{position:absolute;left:72px;top:160px;display:flex;align-items:center;gap:14px;font-size:26px;font-weight:600;letter-spacing:.16em;color:rgba(255,255,255,.55)}
  .kicker::before{content:'';width:38px;height:2px;background:linear-gradient(90deg,#8C6CFF,transparent)}
  h1{position:absolute;left:72px;top:206px;font-size:132px;font-weight:900;line-height:1.06;letter-spacing:-.02em;color:#fff;text-shadow:0 20px 60px rgba(0,0,0,.45)}
  h1 em{font-style:normal;color:#BCA6FF;text-shadow:0 0 80px rgba(140,108,255,.55)}
  .sub{position:absolute;left:76px;top:376px;font-size:40px;font-weight:500;color:rgba(255,255,255,.72);letter-spacing:.03em}
  .sub b{color:#fff;font-weight:700}
  .cardwrap{position:absolute;left:50px;top:452px;width:980px;height:651px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.12),0 0 160px rgba(124,92,255,.35)}
  .cardwrap img{display:block;position:absolute;left:0px;top:0px;width:1198px;height:auto}
  .fade{position:absolute;left:0;right:0;bottom:0;height:240px;background:linear-gradient(180deg,rgba(7,7,13,0),rgba(7,7,13,.72))}
  .chips{position:absolute;left:50px;right:50px;top:1168px;display:flex;justify-content:center;gap:14px;flex-wrap:nowrap}
  .chip{padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);font-size:24px;color:rgba(255,255,255,.86);letter-spacing:.02em;white-space:nowrap}
  .chip.hot{background:#7C5CFF;border-color:#7C5CFF;box-shadow:0 10px 30px rgba(124,92,255,.45);color:#fff;font-weight:600}
  .foot{position:absolute;left:0;right:0;top:1288px;text-align:center;font-size:26px;color:rgba(255,255,255,.5);letter-spacing:.06em}
  .foot b{color:#BCA6FF;font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"></div><div class="b1"></div><div class="b2"></div><div class="grid"></div><div class="vig"></div>
  <div class="wrap">
    <div class="brand"><img src="assets/icon.png" alt=""><div><div class="n">dsh-web-browser</div><div class="v">v0.2.10 · MIT</div></div></div>
    <div class="kicker">DSH 插件</div>
    <h1>不用<em>切窗口</em></h1>
    <div class="sub"><b>DSH 主界面</b>直接开网页</div>
    <div class="cardwrap"><img src="assets/panel-01.jpg" alt=""></div>
    <div class="fade"></div>
    <div class="chips">
      <span class="chip hot">整页面板</span>
      <span class="chip">多标签</span>
      <span class="chip">右键菜单</span>
      <span class="chip">浏览历史</span>
    </div>
    <div class="foot">GitHub 搜 <b>dsh-web-browser</b> · 点个 Star 收更新</div>
  </div>
</div>
</body>
</html>
